<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An accessible interactive page built with HTML, CSS, and JavaScript.">
    <title>Interactive Web Page</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Interactive Web Page</h1>
      <p>An accessible interactive page built with HTML, CSS, and JavaScript.</p>
      <button type="button" id="greeting-button">Show greeting</button>
      <p id="greeting" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
